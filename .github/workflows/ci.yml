name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # MSVC's AddressSanitizer is incompatible with the /RTC1 checks a Debug build has.
          - name: Windows x86_64 MSVC
            os: windows-2025
            msvc_arch: x64
            build_type: RelWithDebInfo
          # C++26 as well as the C++23 the library asks for: libc++ gives a span of const
          # elements an initializer-list constructor there, which changes what braces build.
          - name: macOS arm64 Apple Clang C++26
            os: macos-15
            cxx_standard: 26
    steps:
      - uses: actions/checkout@v7

      - name: Set up the MSVC environment
        if: matrix.msvc_arch
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type || 'Debug' }}
          -DSERPENT_TEST_SANITIZE=${{ matrix.sanitize || 'ON' }}
          ${{ matrix.cxx_standard && format('-DCMAKE_CXX_STANDARD={0}', matrix.cxx_standard) || '' }}

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
