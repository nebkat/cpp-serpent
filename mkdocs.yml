site_name: serpent
site_description: Zero-copy JSON and BJData for C++23
site_url: https://nebkat.github.io/cpp-serpent/
repo_url: https://github.com/nebkat/cpp-serpent
repo_name: nebkat/cpp-serpent
edit_uri: edit/main/docs/

theme:
  name: material
  icon:
    logo: material/snake
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Guide:
      - Your types: types.md
      - Reflection: reflection.md
      - Reading: reading.md
      - Writing: writing.md
  - Formats:
      - JSON: json.md
      - BJData: bjdata.md
  - Design: design.md
